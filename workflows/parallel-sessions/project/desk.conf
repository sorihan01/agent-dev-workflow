# Settings for tools/desk.sh, tools/land.sh and the Stop hook. Sourced by bash: keep it to assignments.

# What a ticket ID looks like. Desk files, branch names and .next/ files use it.
TICKET_RE='^[A-Z]+-[0-9]+$'

# The branch a desk opens. {ticket} is the ticket ID in lowercase, {slug} is what you pass to `desk.sh open`.
BRANCH_PATTERN='desk/{ticket}-{slug}'

# The branch everything lands on.
DEFAULT_BRANCH='main'

# How many desks can be open at once. Slot N adds N to every base port below.
SLOTS=9

# One line per repo a desk can open: name | path from this folder | base port | install command.
# The base port is what that repo's dev server uses on the main checkout (slot 0). Leave the
# port at 0 for a repo with no server, and the install command empty to skip installing.
REPOS=(
  "app|.|3000|"
)

# Gitignored files copied from the main checkout into each worktree, with every
# localhost:<base port> moved to this desk's port. Never printed.
ENV_FILES=".env .env.local"
